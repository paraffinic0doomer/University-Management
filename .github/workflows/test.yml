name: Java CI with Maven

# Trigger the workflow on push or pull request events
on:
  push:
    branches:
      - main
      - testing/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Step 4: Build the project (compile without running tests)
      - name: Build with Maven
        run: mvn clean compile -DskipTests

      # Step 5: Run all tests
      - name: Run tests
        run: mvn test

      # Step 6: Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

      # Step 7: Package the application
      - name: Package application
        run: mvn package -DskipTests

      # Step 8: Upload the packaged artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: University-Management
          path: target/*.jar

  # Job to check code quality (optional but recommended)
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven verify
        run: mvn verify -DskipTests

  # Summary job that will fail if any test fails
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
      - name: Check test results
        shell: bash
        run: |
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "Tests failed! Please fix the failing tests before merging."
            exit 1
          else
            echo "All tests passed successfully!"
          fi

