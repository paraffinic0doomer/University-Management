<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - University Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                        </svg>
                    </div>
                    <span class="sidebar-logo-text">UniManager</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <a href="dashboard.html" class="nav-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                        Dashboard
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Management</div>
                    <a href="students.html" class="nav-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                        Students
                    </a>
                    <a href="teachers.html" class="nav-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                        </svg>
                        Teachers
                    </a>
                    <a href="courses.html" class="nav-item active">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                        </svg>
                        Courses
                    </a>
                    <a href="departments.html" class="nav-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                        Departments
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Account</div>
                    <a href="#" class="nav-item" onclick="logout()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        Logout
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-search">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" placeholder="Search courses..." id="searchInput" onkeyup="filterCourses()">
                </div>

                <div class="header-actions">
                    <div class="header-user">
                        <div class="user-avatar" id="userAvatar">T</div>
                        <div class="user-info">
                            <div class="user-name" id="userName">Teacher</div>
                            <div class="user-role" id="userRole">Administrator</div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div id="alertContainer"></div>

                <div class="page-header">
                    <div>
                        <h1 class="page-title">Courses</h1>
                        <p class="page-subtitle">Manage course catalog</p>
                    </div>
                    <button class="btn btn-primary" onclick="openAddModal()" id="addBtn" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        Add Course
                    </button>
                </div>

                <div class="card">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Name</th>
                                    <th>Credits</th>
                                    <th>Department</th>
                                    <th>Teacher</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="coursesTableBody">
                                <tr>
                                    <td colspan="6" class="loading">
                                        <div class="spinner"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="courseModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Add Course</h3>
                <button class="modal-close" onclick="closeModal('courseModal')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form id="courseForm" onsubmit="saveCourse(event)">
                <div class="modal-body">
                    <input type="hidden" id="courseId">

                    <div class="form-group">
                        <label class="form-label" for="code">Course Code</label>
                        <input type="text" id="code" class="form-input" placeholder="e.g., CS101">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="name">Course Name *</label>
                        <input type="text" id="name" class="form-input" placeholder="Enter course name" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="credits">Credits</label>
                        <input type="number" id="credits" class="form-input" placeholder="Enter credits" min="1" max="10">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="departmentId">Department</label>
                        <select id="departmentId" class="form-select">
                            <option value="">Select Department</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="teacherId">Teacher</label>
                        <select id="teacherId" class="form-select">
                            <option value="">Select Teacher</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('courseModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Course</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h3 class="modal-title">Delete Course</h3>
                <button class="modal-close" onclick="closeModal('deleteModal')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this course? This action cannot be undone.</p>
                <input type="hidden" id="deleteCourseId">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let allCourses = [];
        let departments = [];
        let teachers = [];

        checkAuth();

        if (isTeacher()) {
            document.getElementById('addBtn').style.display = 'flex';
        }

        loadCourses();
        loadDepartments();
        loadTeachers();

        async function loadCourses() {
            try {
                allCourses = await apiRequest('/api/courses');
                renderCourses(allCourses);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function loadDepartments() {
            try {
                departments = await apiRequest('/api/departments');
                const select = document.getElementById('departmentId');
                select.innerHTML = '<option value="">Select Department</option>' +
                    departments.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function loadTeachers() {
            try {
                teachers = await apiRequest('/api/teachers');
                const select = document.getElementById('teacherId');
                select.innerHTML = '<option value="">Select Teacher</option>' +
                    teachers.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderCourses(courses) {
            const tbody = document.getElementById('coursesTableBody');
            const teacher = isTeacher();

            if (courses.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                                </svg>
                                <h3>No courses found</h3>
                                <p>Add your first course to get started</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = courses.map(c => `
                <tr>
                    <td><span class="badge badge-warning">${escapeHtml(c.code) || '-'}</span></td>
                    <td>${escapeHtml(c.name)}</td>
                    <td>${c.credits || '-'}</td>
                    <td>${c.department?.name ? escapeHtml(c.department.name) : '-'}</td>
                    <td>${c.teacher?.name ? escapeHtml(c.teacher.name) : '-'}</td>
                    <td>
                        <div class="table-actions">
                            ${teacher ? `
                            <button class="action-btn edit" title="Edit" onclick="editCourse(${c.id})">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                            </button>
                            <button class="action-btn delete" title="Delete" onclick="deleteCourse(${c.id})">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                            ` : '-'}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterCourses() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCourses.filter(c =>
                c.name.toLowerCase().includes(query) ||
                (c.code && c.code.toLowerCase().includes(query))
            );
            renderCourses(filtered);
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Course';
            document.getElementById('courseForm').reset();
            document.getElementById('courseId').value = '';
            openModal('courseModal');
        }

        function editCourse(id) {
            const course = allCourses.find(c => c.id === id);
            if (!course) return;

            document.getElementById('modalTitle').textContent = 'Edit Course';
            document.getElementById('courseId').value = course.id;
            document.getElementById('code').value = course.code || '';
            document.getElementById('name').value = course.name;
            document.getElementById('credits').value = course.credits || '';
            document.getElementById('departmentId').value = course.department?.id || '';
            document.getElementById('teacherId').value = course.teacher?.id || '';

            openModal('courseModal');
        }

        async function saveCourse(e) {
            e.preventDefault();

            const id = document.getElementById('courseId').value;
            const data = {
                code: document.getElementById('code').value,
                name: document.getElementById('name').value,
                credits: parseInt(document.getElementById('credits').value) || null
            };

            const deptId = document.getElementById('departmentId').value;
            if (deptId) {
                data.department = { id: parseInt(deptId) };
            }

            const teacherId = document.getElementById('teacherId').value;
            if (teacherId) {
                data.teacher = { id: parseInt(teacherId) };
            }

            try {
                if (id) {
                    await apiRequest(`/api/courses/${id}`, 'PUT', data);
                } else {
                    await apiRequest('/api/courses', 'POST', data);
                }
                closeModal('courseModal');
                showAlert(document.getElementById('alertContainer'),
                    id ? 'Course updated successfully' : 'Course added successfully', 'success');
                loadCourses();
            } catch (error) {
                showAlert(document.getElementById('alertContainer'), 'Error saving course');
            }
        }

        function deleteCourse(id) {
            document.getElementById('deleteCourseId').value = id;
            openModal('deleteModal');
        }

        async function confirmDelete() {
            const id = document.getElementById('deleteCourseId').value;
            try {
                await apiRequest(`/api/courses/${id}`, 'DELETE');
                closeModal('deleteModal');
                showAlert(document.getElementById('alertContainer'), 'Course deleted successfully', 'success');
                loadCourses();
            } catch (error) {
                showAlert(document.getElementById('alertContainer'), 'Error deleting course');
            }
        }
    </script>
</body>
</html>
